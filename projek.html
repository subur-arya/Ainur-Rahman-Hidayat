<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ainur Rahman Hidayat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="antialiased">
    <!-- Navigation -->
    <nav class="fixed w-full glass-effect z-50 transition-all duration-300">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center">
                    <span class="text-xl font-bold glow-text">Ainur Rahman Hidayat
                        <span class="text-xl font-light glow-text">| Projek</span>
                    </span>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-center space-x-4">
                        <a href="index.html" class="animated-underline px-3 py-2 text-sm font-medium text-slate-300 hover:text-white">Beranda</a>
                        <a href="projek.html" class="animated-underline px-3 py-2 text-sm font-medium text-slate-300 hover:text-white">Projek</a>
                        <a href="#knowledge" class="animated-underline px-3 py-2 text-sm font-medium text-slate-300 hover:text-white">Knowledge Base</a>
                        <a href="#about" class="animated-underline px-3 py-2 text-sm font-medium text-slate-300 hover:text-white">About</a>
                        <a href="#contact" class="btn-primary ml-4 px-4 py-2 text-white text-sm font-medium rounded-lg">Contact</a>
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button type="button" id="mobile-menu-button" class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-white hover:bg-white hover:bg-opacity-10 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile menu, hidden by default -->
        <div id="mobile-menu" class="hidden md:hidden shadow-lg">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Beranda</a>
                <a href="projek.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Projek</a>
                <a href="#knowledge" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Knowledge Base</a>
                <a href="#about" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">About</a>
                <a href="#contact" class="block px-3 py-2 rounded-md text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700">Contact</a>
            </div>
        </div>
    </nav>

    <section id="projek" class="py-20 projek-gradient">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col lg:flex-row gap-8">
                <!-- Sidebar Kategori -->
                <aside class="lg:w-72 flex-shrink-0">
                    <div class="lg:sticky lg:top-24">
                        <div class="glass-effect rounded-2xl p-6 border border-white border-opacity-10">
                            <h3 class="text-xl font-bold text-white mb-6 glow-text">Kategori Projek</h3>
                            <div class="space-y-2" id="category-filter">
                                <button class="category-btn active w-full text-left px-4 py-3 rounded-lg transition-all duration-300" data-category="all">
                                    <span class="flex items-center justify-between">
                                        <span class="font-medium">Semua Projek</span>
                                        <span class="category-count text-xs">0</span>
                                    </span>
                                </button>
                                <button class="category-btn w-full text-left px-4 py-3 rounded-lg transition-all duration-300" data-category="pemrograman">
                                    <span class="flex items-center justify-between">
                                        <span class="font-medium">💻 Pemrograman</span>
                                        <span class="category-count text-xs">0</span>
                                    </span>
                                </button>
                                <button class="category-btn w-full text-left px-4 py-3 rounded-lg transition-all duration-300" data-category="robotik">
                                    <span class="flex items-center justify-between">
                                        <span class="font-medium">🤖 Robotik</span>
                                        <span class="category-count text-xs">0</span>
                                    </span>
                                </button>
                                <button class="category-btn w-full text-left px-4 py-3 rounded-lg transition-all duration-300" data-category="matematika">
                                    <span class="flex items-center justify-between">
                                        <span class="font-medium">📐 Matematika</span>
                                        <span class="category-count text-xs">0</span>
                                    </span>
                                </button>
                                <button class="category-btn w-full text-left px-4 py-3 rounded-lg transition-all duration-300" data-category="kontrol">
                                    <span class="flex items-center justify-between">
                                        <span class="font-medium">⚙️ Kontrol Otomatis</span>
                                        <span class="category-count text-xs">0</span>
                                    </span>
                                </button>
                                <button class="category-btn w-full text-left px-4 py-3 rounded-lg transition-all duration-300" data-category="ai">
                                    <span class="flex items-center justify-between">
                                        <span class="font-medium">🧠 AI & Machine Learning</span>
                                        <span class="category-count text-xs">0</span>
                                    </span>
                                </button>
                                <button class="category-btn w-full text-left px-4 py-3 rounded-lg transition-all duration-300" data-category="web">
                                    <span class="flex items-center justify-between">
                                        <span class="font-medium">🌐 Web Development</span>
                                        <span class="category-count text-xs">0</span>
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Projects Grid -->
                <div class="flex-1">
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-white mb-2">
                            <span id="active-category-title">Semua Projek</span>
                        </h2>
                        <p class="text-slate-400" id="active-category-desc">Menampilkan semua projek yang telah saya kerjakan</p>
                    </div>
                    <div id="projects-container" class="grid gap-8 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-3"> 
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
    const projects = [
        {
        title: "Sistem Kontrol PID: Teori dan Simulasi",
        description: "Belajar dasar Proportional-Integral-Derivative (PID) Controller beserta simulasi penerapannya untuk memahami perilaku sistem kontrol secara nyata.",
        image: "./projek/projek_1/thumbnail.jpg",
        link: "./projek/projek_1/projek.html",
        tags: ["Kontrol Otomatis", "PID Controller", "Simulasi"],
        category: "kontrol",
        color: "indigo"
        },
        {
        title: "Food Delivery App",
        description: "Mobile application connecting users with local restaurants and delivery services.",
        image: "./projek/projek_2/thumbnail.jpg",
        link: "./projek/projek_2/projek.html",
        tags: ["Flutter", "Firebase", "Google Maps API"],
        category: "pemrograman",
        color: "emerald"
        },
        {
        title: "E-Commerce Platform",
        description: "Complete online shopping solution with inventory management and payment processing.",
        image: "./projek/projek_3/thumbnail.jpg",
        link: "./projek/projek_3/projek.html",
        tags: ["Vue.js", "Laravel", "MySQL"],
        category: "web",
        color: "pink"
        }
    ];

    const container = document.getElementById("projects-container");
    const categoryButtons = document.querySelectorAll('.category-btn');
    const categoryTitle = document.getElementById('active-category-title');
    const categoryDesc = document.getElementById('active-category-desc');

    // Category descriptions
    const categoryInfo = {
        all: { title: "Semua Projek", desc: "Menampilkan semua projek yang telah saya kerjakan" },
        pemrograman: { title: "Projek Pemrograman", desc: "Aplikasi dan software development yang telah dibuat" },
        robotik: { title: "Projek Robotik", desc: "Proyek-proyek terkait robotika dan sistem embedded" },
        matematika: { title: "Projek Matematika", desc: "Implementasi konsep matematika dan komputasi numerik" },
        kontrol: { title: "Kontrol Otomatis", desc: "Sistem kontrol dan otomasi untuk berbagai aplikasi" },
        ai: { title: "AI & Machine Learning", desc: "Projek kecerdasan buatan dan pembelajaran mesin" },
        web: { title: "Web Development", desc: "Website dan aplikasi web modern" }
    };

    // Count projects per category
    function updateCategoryCounts() {
        const counts = { all: projects.length };
        projects.forEach(proj => {
            counts[proj.category] = (counts[proj.category] || 0) + 1;
        });

        categoryButtons.forEach(btn => {
            const cat = btn.dataset.category;
            const countSpan = btn.querySelector('.category-count');
            countSpan.textContent = counts[cat] || 0;
        });
    }

    // Render projects
    function renderProjects(category = 'all') {
        container.innerHTML = '';
        
        const filteredProjects = category === 'all' 
            ? projects 
            : projects.filter(proj => proj.category === category);

        if (filteredProjects.length === 0) {
            container.innerHTML = `
                <div class="col-span-full text-center py-16">
                    <div class="text-6xl mb-4">📂</div>
                    <h3 class="text-xl font-semibold text-white mb-2">Belum Ada Projek</h3>
                    <p class="text-slate-400">Projek untuk kategori ini sedang dalam pengembangan</p>
                </div>
            `;
            return;
        }

        filteredProjects.forEach(proj => {
            const card = document.createElement("div");
            card.className = "card-hover rounded-2xl overflow-hidden project-card";
            card.dataset.category = proj.category;

            card.innerHTML = `
            <div class="relative h-48 overflow-hidden">
                <img src="${proj.image}" alt="${proj.title}" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-${proj.color}-600 to-transparent opacity-0 hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                <a href="${proj.link}" class="px-6 py-2 glass-effect text-white rounded-full font-semibold hover:bg-white hover:bg-opacity-20">View Details</a>
                </div>
            </div>
            <div class="p-6">
                <h3 class="text-xl font-semibold text-white">${proj.title}</h3>
                <p class="mt-2 text-slate-400">${proj.description}</p>
                <div class="mt-4 flex flex-wrap gap-2">
                ${proj.tags.map(tag => `
                    <span class="px-3 py-1 bg-${proj.color}-500 bg-opacity-20 text-${proj.color}-300 text-xs font-medium rounded-full border border-${proj.color}-500 border-opacity-30">${tag}</span>
                `).join("")}
                </div>
            </div>
            `;

            container.appendChild(card);
        });
    }

    // Category filter functionality
    categoryButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const category = this.dataset.category;
            
            // Update active state
            categoryButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            // Update title and description
            categoryTitle.textContent = categoryInfo[category].title;
            categoryDesc.textContent = categoryInfo[category].desc;

            // Render filtered projects
            renderProjects(category);
        });
    });

    // Initialize
    updateCategoryCounts();
    renderProjects();
    </script>

    <!-- Footer -->
    <footer style="background-color: var(--dark-bg);" class="text-white border-t border-white border-opacity-10">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center">
                <p class="text-slate-400 text-sm">&copy; 2024 Ainur Rahman Hidayat. All rights reserved.</p>
                <p class="text-slate-500 text-xs mt-2">Built with passion and modern web technologies</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript for mobile menu and smooth scrolling -->
    <script>
        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });

        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                    // Close mobile menu if open
                    document.getElementById('mobile-menu').classList.add('hidden');
                }
            });
        });

        // Add scroll effect to navigation
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.style.backgroundColor = 'rgba(255, 255, 255, 0.15)';
            } else {
                nav.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            }
        });
    </script>

</body>
</html>
